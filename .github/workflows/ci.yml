name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee typecheck.log

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore

      - name: Fail on type-check errors
        if: steps.typecheck.outcome != 'success'
        run: exit 1

      - name: Tests
        run: pnpm test -- --run

      - name: Production build
        run: pnpm build
